* { box-sizing: border-box; }

  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink);

  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

.date .kw { color: var(--muted); font-family: var(--f-mono); font-size: .55em; letter-spacing: .06em; margin-left: .6em; vertical-align: middle; }

</style>
<script>try { if (localStorage.getItem("look") === "dark") document.documentElement.dataset.look = "dark"; } catch (e) {}</script>
</head>
<body>
<button class="look" id="look" type="button" aria-label="Zwischen hell und dunkel umschalten">
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>
<div class="wrap">
  <header class="head glass">
    <div>
      <div class="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="sec" id="ss">--</span></div>
      <div class="date" id="date"></div>
    </div>
    <div class="wx">
      <div class="place">Lüneburg · 53,25° N</div>
      <div class="wx-now"><span id="wx-icon"></span><span class="wx-temp" id="wx-temp">–°</span></div>
      <div class="wx-desc" id="wx-desc">Wetter wird geladen …</div>
    </div>
  </header>

  <section class="wxbar glass" aria-label="Wetter in den nächsten Stunden">
    <div class="hours" id="hours"></div>
    <div class="days" id="days"></div>
  </section>

  <section class="panel glass" aria-labelledby="h-rem">
    <h2 id="h-rem">Erinnerungen <span class="badge" id="rem-count"></span></h2>
    <form class="add" id="rem-form" autocomplete="off">
      <input id="rem-text" type="text" placeholder="Neue Erinnerung" aria-label="Neue Erinnerung" maxlength="200">
      <input id="rem-due" type="date" aria-label="Fällig am (optional)">
      <button type="submit">+</button>
    </form>
    <ul class="list" id="rem-list"></ul>
    <button class="toggle" id="rem-toggle" type="button" hidden></button>
  </section>

  <footer class="foot" id="foot">Wetter: Open-Meteo · Erinnerungen werden auf diesem Gerät gespeichert</footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LAT = 53.2464, LON = 10.4115, TZ = "Europe/Berlin";
  const fmt = (o) => new Intl.DateTimeFormat("de-DE", { timeZone: TZ, ...o });
  const fTime = fmt({ hour: "2-digit", minute: "2-digit" });
  const fDay = fmt({ weekday: "long", day: "numeric", month: "long" });
  const fShortDay = fmt({ weekday: "short", day: "numeric", month: "short" });
  const ymd = (d) => fmt({ year: "numeric", month: "2-digit", day: "2-digit" }).format(d).split(".").reverse().join("-");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- Uhr ---------- */
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
  }
  let lastDay = "";
  function tick() {
    const now = new Date();
    const p = Object.fromEntries(fmt({ hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(now).map((x) => [x.type, x.value]));
    $("hh").textContent = p.hour; $("mm").textContent = p.minute; $("ss").textContent = p.second;
    const day = fDay.format(now);
    if (day !== lastDay) { lastDay = day; $("date").innerHTML = `${esc(day)}<span class="kw">KW ${isoWeek(now)}</span>`; renderReminders(); }
  }

  /* ---------- Wetter (direkt von Open-Meteo, kein PC nötig) ---------- */
  const WMO = {
    0: ["Klar", "sun"], 1: ["Überwiegend klar", "sun"], 2: ["Teils bewölkt", "partly"], 3: ["Bedeckt", "cloud"],
    45: ["Nebel", "fog"], 48: ["Reifnebel", "fog"],
    51: ["Leichter Niesel", "drizzle"], 53: ["Niesel", "drizzle"], 55: ["Starker Niesel", "drizzle"], 56: ["Gefrierender Niesel", "drizzle"], 57: ["Gefrierender Niesel", "drizzle"],
    61: ["Leichter Regen", "rain"], 63: ["Regen", "rain"], 65: ["Starker Regen", "rain"], 66: ["Gefrierender Regen", "rain"], 67: ["Gefrierender Regen", "rain"],
    71: ["Leichter Schnee", "snow"], 73: ["Schnee", "snow"], 75: ["Starker Schnee", "snow"], 77: ["Schneegriesel", "snow"],
    80: ["Regenschauer", "rain"], 81: ["Regenschauer", "rain"], 82: ["Heftige Schauer", "rain"], 85: ["Schneeschauer", "snow"], 86: ["Schneeschauer", "snow"],
    95: ["Gewitter", "storm"], 96: ["Gewitter mit Hagel", "storm"], 99: ["Gewitter mit Hagel", "storm"],
  };
  const CLOUD = '<path d="M7 18h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 9.6 4.2 4.2 0 0 0 7 18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>';
  const ICON = {
    sun: '<circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>',
    moon: '<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
    partly: '<g transform="translate(-2 -3) scale(.8)"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v2M3 12h2M5.6 5.6l1.4 1.4M18.4 5.6 17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><path d="M9 20h8.5a3.5 3.5 0 0 0 .5-6.96 4.8 4.8 0 0 0-9.1-1.2A3.7 3.7 0 0 0 9 20z" fill="var(--surface)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
    cloud: CLOUD,
    fog: '<g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>',
    drizzle: '<g transform="translate(0 -3)">' + CLOUD + '</g><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 19v.5M13 19v.5M17 19v.5"/></g>',
    rain: '<g transform="translate(0 -3)">' + CLOUD + '</g><g stroke="var(--brick)" stroke-width="1.6" stroke-linecap="round"><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></g>',
    snow: '<g transform="translate(0 -3)">' + CLOUD + '</g><g fill="currentColor"><circle cx="9" cy="19.5" r="1.1"/><circle cx="13" cy="21" r="1.1"/><circle cx="17" cy="19.5" r="1.1"/></g>',
    storm: '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M13 16l-2.5 4h3l-2 3.5" fill="none" stroke="var(--brick)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  };
  const icon = (code, night) => {
    let k = (WMO[code] || ["", "cloud"])[1];
    if (night && k === "sun") k = "moon";
    return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
  };
  const deg = (n) => (n == null ? "–" : Math.round(n).toLocaleString("de-DE")) + "°";

  async function loadWeather() {
    const url = "https://api.open-meteo.com/v1/forecast" +
      `?latitude=${LAT}&longitude=${LON}&timezone=Europe%2FBerlin&forecast_days=4&wind_speed_unit=kmh` +
      "&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m" +
      "&hourly=temperature_2m,weather_code,precipitation_probability" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset";
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const nowH = d.current.time.slice(0, 13);
      const i0 = Math.max(0, d.hourly.time.findIndex((t) => t.slice(0, 13) >= nowH));
      const w = {
        temp: d.current.temperature_2m, feels: d.current.apparent_temperature, code: d.current.weather_code,
        isDay: !!d.current.is_day, wind: d.current.wind_speed_10m,
        hourly: d.hourly.time.slice(i0, i0 + 12).map((t, k) => ({ t, temp: d.hourly.temperature_2m[i0 + k], code: d.hourly.weather_code[i0 + k], rain: d.hourly.precipitation_probability[i0 + k] })),
        daily: d.daily.time.map((date, k) => ({ date, code: d.daily.weather_code[k], min: d.daily.temperature_2m_min[k], max: d.daily.temperature_2m_max[k], rain: d.daily.precipitation_probability_max[k], sunrise: d.daily.sunrise[k], sunset: d.daily.sunset[k] })),
      };
      try { localStorage.setItem("wx", JSON.stringify(w)); } catch (e) {}
      renderWeather(w);
    } catch (e) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem("wx")); } catch (e2) {}
      if (cached) renderWeather(cached);
      else $("wx-desc").textContent = "Wetter gerade nicht erreichbar.";
    }
  }

  function renderWeather(w) {
    const today = w.daily && w.daily[0];
    $("wx-icon").innerHTML = icon(w.code, !w.isDay);
    $("wx-temp").textContent = deg(w.temp);
    $("wx-desc").innerHTML = `<b>${esc((WMO[w.code] || ["–"])[0])}</b> · gefühlt ${deg(w.feels)} · Wind ${Math.round(w.wind)} km/h` +
      (today ? `<br>Heute ${deg(today.min)} bis ${deg(today.max)} · Regen ${today.rain ?? 0} %` : "");
    $("hours").innerHTML = (w.hourly || []).map((h) => {
      const night = today && (h.t < today.sunrise || h.t > today.sunset);
      return `<div class="hour"><span class="t">${h.t.slice(11, 13)} h</span>${icon(h.code, night)}<span class="v">${deg(h.temp)}</span><span class="r ${h.rain >= 40 ? "wet" : ""}">${h.rain ? h.rain + " %" : ""}</span></div>`;
    }).join("");
    $("days").innerHTML = (w.daily || []).slice(1).map((d) =>
      `<span><b>${esc(fmt({ weekday: "short" }).format(new Date(d.date + "T12:00")))}</b> ${deg(d.min)} / ${deg(d.max)} · ${esc((WMO[d.code] || ["–"])[0])}</span>`).join("") +
      (today ? `<span>Sonne ${today.sunrise.slice(11)} – ${today.sunset.slice(11)}</span>` : "");
  }

  /* ---------- Erinnerungen (im Gerätespeicher) ---------- */
  let reminders = [], showDone = false;
  try { reminders = JSON.parse(localStorage.getItem("reminders")) || []; } catch (e) { reminders = []; }
  const save = () => { try { localStorage.setItem("reminders", JSON.stringify(reminders)); } catch (e) {} };

  function dayLabel(dateStr) {
    const now = new Date();
    if (dateStr === ymd(now)) return "Heute";
    if (dateStr === ymd(new Date(now.getTime() + 864e5))) return "Morgen";
    if (dateStr === ymd(new Date(now.getTime() - 864e5))) return "Gestern";
    return fShortDay.format(new Date(dateStr + "T12:00"));
  }

  function renderReminders() {
    const list = $("rem-list"), todayStr = ymd(new Date());
    const open = reminders.filter((r) => !r.done).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || a.created - b.created);
    const done = reminders.filter((r) => r.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const overdue = open.filter((r) => r.due && r.due < todayStr).length;
    $("rem-count").textContent = open.length ? `${open.length} offen${overdue ? ` · ${overdue} überfällig` : ""}` : "";
    const row = (r) => {
      let due = "";
      if (r.due) {
        const cls = r.due < todayStr ? "over" : r.due === todayStr ? "today" : "";
        due = `<span class="due ${cls}">${esc(dayLabel(r.due))}</span>`;
      }
      return `<li class="rem ${r.done ? "done" : ""}"><input type="checkbox" id="r-${esc(r.id)}" data-id="${esc(r.id)}" ${r.done ? "checked" : ""}>` +
        `<label for="r-${esc(r.id)}">${esc(r.text)}</label>${r.done ? `<button class="del" data-del="${esc(r.id)}" type="button">löschen</button>` : due}</li>`;
    };
    let html = open.map(row).join("");
    if (showDone) html += done.map(row).join("");
    if (!open.length && !(showDone && done.length)) html = `<li class="empty">${done.length ? "Alles erledigt." : "Noch keine Erinnerungen. Schreib oben eine rein und tippe auf +."}</li>`;
    list.innerHTML = html;
    const t = $("rem-toggle");
    t.hidden = !done.length;
    t.textContent = showDone ? "Erledigte ausblenden" : `${done.length} erledigte zeigen`;
  }

  $("rem-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const text = $("rem-text").value.trim();
    if (!text) { $("rem-text").focus(); return; }
    reminders.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, due: $("rem-due").value || null, done: false, created: Date.now() });
    save(); renderReminders();
    $("rem-text").value = ""; $("rem-due").value = "";
  });
  $("rem-list").addEventListener("change", (ev) => {
    const r = reminders.find((x) => x.id === ev.target.dataset.id); if (!r) return;
    r.done = ev.target.checked; r.doneAt = r.done ? Date.now() : null;
    save(); renderReminders();
  });
  $("rem-list").addEventListener("click", (ev) => {
    const id = ev.target.dataset && ev.target.dataset.del; if (!id) return;
    reminders = reminders.filter((x) => x.id !== id);
    save(); renderReminders();
  });
  $("rem-toggle").addEventListener("click", () => { showDone = !showDone; renderReminders(); });

  /* ---------- Hell / Dunkel ---------- */
  $("look").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.look !== "dark";
    if (dark) root.dataset.look = "dark"; else delete root.dataset.look;
    try { localStorage.setItem("look", dark ? "dark" : "light"); } catch (e) {}
    if (window.setIcon) window.setIcon(dark);
  });

  /* ---------- Start ---------- */
  tick();
  setInterval(tick, 1000);
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  // Beim Zurückkehren in die App sofort aktualisieren
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); loadWeather(); } });
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
